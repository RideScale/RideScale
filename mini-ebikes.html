<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini E-Bikes | RideScale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">Ride<span>Scale</span></div>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="page">
    <h1><span>Mini E-Bikes</span> Details</h1>

    <p>Choose an E-Bike style, then choose a size.</p>

    <section class="product-gallery selectable-gallery">
      <button class="image-choice active" data-model="Red Frame Mini E-Bike">
        <img src="mini-ebike-1.png" alt="Red and black 3D printed mini e-bike">
        <span>Red Frame Style</span>
      </button>

      <button class="image-choice" data-model="White Frame Mini E-Bike">
        <img src="mini-ebike-2.png" alt="White and black 3D printed mini e-bike">
        <span>White Frame Style</span>
      </button>
    </section>

    <p id="selectedModel" class="selected-price">Selected Model: <strong>Red Frame Mini E-Bike</strong></p>

    <section class="size-picker">
      <h2>Pick Your Size</h2>
      <div class="size-options">
        <button class="size-option" data-size="Medium" data-dimensions="Up to 4 × 4 × 4 in" data-price="10">
          <strong>Medium</strong>
          <span>Up to 4 × 4 × 4 in</span>
          <b>$10</b>
        </button>

        <button class="size-option" data-size="Large" data-dimensions="Up to 6 × 6 × 6 in" data-price="15">
          <strong>Large</strong>
          <span>Up to 6 × 6 × 6 in</span>
          <b>$15</b>
        </button>
      </div>

      <p id="selectedPrice" class="selected-price">Selected Size: <strong>None</strong></p>

      <div class="cart-actions">
        <button id="addToCartBtn" class="cart-button" disabled>Add to Cart</button>
        <a class="cart-link" href="cart.html">View Cart</a>
        <a class="cart-link" href="custom-orders.html">Request a Custom Print</a>
      </div>
    </section>
  </main>

  <footer>© 2026 RideScale.</footer>
  <script src="cart.js"></script>
  <script>setupSizePicker("Mini E-Bikes");</script>
</body>
</html>
