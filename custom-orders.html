<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Request Form | RideScale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">Ride<span>Scale</span></div>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="page">
    <h1><span>Order</span>Request</h1>
    <p class="note">Choose a product, size, and add any notes. Use Custom Print only if you want something special made.</p>

    <form class="custom-form" action="https://formsubmit.co/Origami@post.com" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="_subject" value="New RideScale Order Request">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <label>
        Name
        <input type="text" name="Name" placeholder="Your name" required>
      </label>

      <label>
        Email
        <input type="email" name="Email" placeholder="your@email.com" required>
      </label>

      <label>
        Phone Number
        <input type="tel" name="Phone Number" placeholder="(123) 456-7890">
      </label>

      <label>
        What product do you want?
        <select name="Product" required>
          <option value="">Choose a product</option>
          <option value="Mini Bikes">Mini Bikes</option>
          <option value="Mini E-Bikes">Mini E-Bikes</option>
          <option value="Fidgets">Fidgets</option>
          <option value="Keychains">Keychains</option>
          <option value="Desk Toys">Desk Toys</option>
          <option value="Custom Print">Custom Print</option>
        </select>
      </label>

      <label>
        Size
        <select name="Size" required>
          <option value="">Choose a size</option>
          <option value="Small, up to 2 × 2 × 2 in">Small, up to 2 × 2 × 2 in</option>
          <option value="Medium, up to 4 × 4 × 4 in">Medium, up to 4 × 4 × 4 in</option>
          <option value="Large, up to 6 × 6 × 6 in">Large, up to 6 × 6 × 6 in</option>
        </select>
      </label>

      <label>
        Custom Print Details
        <textarea name="Custom Print Details" rows="5" placeholder="Only fill this out if you selected Custom Print. Describe what you want made."></textarea>
      </label>

      <label>
        Upload File or Image
        <input type="file" name="Attachment" accept="image/*,.stl,.3mf,.obj,.step,.stp,.pdf">
      </label>

      <label>
        Notes
        <textarea name="Notes" rows="4" placeholder="Color, deadline, special details, or anything else"></textarea>
      </label>

      <button type="submit">Submit Request</button>
    </form>

    <p class="note small-note">
      If this is your first form submission, check Origami@post.com for a FormSubmit confirmation email.
    </p>
  </main>

  <footer>© 2026 RideScale.</footer>
</body>
</html>
