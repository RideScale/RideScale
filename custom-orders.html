<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Order Form | RideScale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">Ride<span>Scale</span></div>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="page">
    <h1><span>Custom</span>Print Request</h1>
    <p class="note">Fill out the form below and include a picture or file of what you want printed.</p>

    <form class="custom-form" action="https://formsubmit.co/Origami@post.com" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="_subject" value="New RideScale Custom Print Request">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <label>
        Name
        <input type="text" name="Name" placeholder="Your name" required>
      </label>

      <label>
        Email
        <input type="email" name="Email" placeholder="your@email.com" required>
      </label>

      <label>
        Phone Number
        <input type="tel" name="Phone Number" placeholder="(123) 456-7890">
      </label>

      <label>
        What do you want printed?
        <textarea name="Print Request" rows="5" placeholder="Describe what you want printed" required></textarea>
      </label>

      <label>
        Size
        <select name="Size" required>
          <option value="">Choose a size</option>
          <option value="Small, up to 2 × 2 × 2 in">Small, up to 2 × 2 × 2 in</option>
          <option value="Medium, up to 4 × 4 × 4 in">Medium, up to 4 × 4 × 4 in</option>
          <option value="Large, up to 6 × 6 × 6 in">Large, up to 6 × 6 × 6 in</option>
        </select>
      </label>

      <label>
        Upload File or Image
        <input type="file" name="Attachment" accept="image/*,.stl,.3mf,.obj,.step,.stp,.pdf">
      </label>

      <label>
        Notes
        <textarea name="Notes" rows="4" placeholder="Color, deadline, special details, or anything else"></textarea>
      </label>

      <button type="submit">Submit Request</button>
    </form>

    <p class="note small-note">
      The first time this form is submitted, you may need to confirm your email address through FormSubmit before messages start coming in.
    </p>
  </main>

  <footer>© 2026 RideScale.</footer>
</body>
</html>
