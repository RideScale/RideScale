<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | RideScale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="nav">
      <div class="brand">Ride<span>Scale</span></div>
      <a href="index.html">Home</a>
      <a href="custom-orders.html">Checkout</a>
    </nav>
  </header>

  <main class="cart-page">
    <h1><span>Your</span> Cart</h1>
    <div id="cartItems"></div>

    <div class="cart-total">Total: <strong id="cartTotal">$0</strong></div>

    <div class="cart-actions">
      <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
      <a class="cart-button" href="custom-orders.html">Checkout / Request Order</a>
    </div>

    <p class="checkout-note">
      Review your cart, then click Checkout / Request Order to send the order request.
    </p>
  </main>

  <footer>© 2026 RideScale.</footer>
  <script src="cart.js"></script>
  <script>renderCart();</script>
</body>
</html>
